name: Build Windows

# Manual trigger. Builds the Python backend (PyInstaller) + the Tauri desktop
# app for Windows (x86_64) and uploads MSI + NSIS installers as artifacts.
# Optionally attaches them to an existing GitHub release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the installers to (e.g. v1.3.1). Leave empty to only upload build artifacts."
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build backend sidecar (PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-backend.txt
          pyinstaller telmi-backend.spec --distpath dist_backend --workpath build_backend --noconfirm

      - name: Place sidecar for Tauri
        shell: bash
        run: |
          mkdir -p frontend/src-tauri/binaries
          cp dist_backend/telmi-backend.exe \
            "frontend/src-tauri/binaries/telmi-backend-x86_64-pc-windows-msvc.exe"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Build Tauri app (Windows)
        working-directory: frontend
        run: npm run tauri build

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telmi-windows
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach installers to release
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            frontend/src-tauri/target/release/bundle/msi/*.msi \
            frontend/src-tauri/target/release/bundle/nsis/*.exe \
            --clobber
