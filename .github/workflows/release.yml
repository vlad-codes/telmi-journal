name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: pip install -r requirements-backend.txt
      - run: pyinstaller telmi-backend.spec --distpath frontend/src-tauri/binaries --noconfirm
      - name: Name Windows sidecar
        shell: pwsh
        run: |
          $triple = (rustc -Vv | Select-String '^host:').ToString().Split(' ')[1]
          Move-Item -Force "frontend/src-tauri/binaries/telmi-backend.exe" "frontend/src-tauri/binaries/telmi-backend-$triple.exe"
      - run: npm ci
        working-directory: frontend
      - run: npm run tauri -- build --bundles nsis
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: telmi-windows-installers
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: pip install -r requirements-backend.txt
      - run: pyinstaller telmi-backend.spec --distpath frontend/src-tauri/binaries --noconfirm
      - name: Name macOS sidecar
        run: |
          triple=$(rustc -Vv | awk '/^host:/ { print $2 }')
          mv frontend/src-tauri/binaries/telmi-backend "frontend/src-tauri/binaries/telmi-backend-$triple"
      - run: npm ci
        working-directory: frontend
      - run: npm run tauri -- build --bundles dmg
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: telmi-macos-installer
          path: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
